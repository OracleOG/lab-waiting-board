<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track My Results</title>
<style>
  :root { --bg: #f4f6fa; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #0369a1; --due: #b45309; --ready: #15803d; --ready-bg: #dcfce7; --due-bg: #fef3c7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #131d33; --text: #eef2f8; --muted: #8fa0bf; --line: #22304d; --accent: #38bdf8; --due: #fbbf24; --ready: #4ade80; --ready-bg: rgba(34,197,94,.15); --due-bg: rgba(251,191,36,.15); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; margin: 20px 0; }
  input { flex: 1; min-width: 0; font: 600 22px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
  input:focus { outline: none; border-color: var(--accent); }
  button { font: 600 16px inherit; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: #dc2626; margin: -8px 0 16px; }
  .ticket { font: 700 30px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .15em; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card.ready { background: var(--ready-bg); border-color: transparent; }
  .card .name { font-weight: 700; font-size: 18px; }
  .card .full { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .due-at { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .right { text-align: right; flex-shrink: 0; }
  .time { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; background: var(--line); color: var(--muted); }
  .due .time, .due .pill { color: var(--due); } .due .pill { background: var(--due-bg); }
  .ready .time { color: var(--ready); } .ready .pill { background: var(--ready); color: #fff; }
  .summary { margin-top: 20px; padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
  .summary.all-ready { background: var(--ready-bg); border-color: transparent; font-weight: 600; }
  .note { margin-top: 24px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .linkbtn { background: none; color: var(--accent); padding: 0; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="lab">Track my results</h1>
  <div class="muted">Enter the ID on your waiting slip.</div>
  <form id="f"><input id="id" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Your ID"><button>Check</button></form>
  <div id="err" class="err"></div>
  <section id="out" hidden>
    <div class="muted">Your ID</div>
    <div class="ticket" id="ticket"></div>
    <div id="tests"></div>
    <div id="summary" class="summary"></div>
    <p class="note">Times are estimates and update live. You can leave this page open, or bookmark it, if you step away from the lab. When a test shows <b>READY</b>, please return to the reception counter. <button class="linkbtn" id="other" type="button">Check a different ID</button></p>
  </section>
</main>
<script src="/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = { waiting: 'In progress', due: 'Finalising', ready: 'Ready' };
let current = null, data = null;

function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function load(ticket) {
  ticket = (ticket || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!ticket) return;
  try {
    data = await api('GET', '/api/track/' + encodeURIComponent(ticket));
    syncClock(data.now);
    current = data.ticket;
    $('err').textContent = '';
    $('id').value = current;
    store('lastTicket', current);
    if (location.pathname !== '/t/' + current) history.replaceState(null, '', '/t/' + current);
    if (data.labName) $('lab').textContent = data.labName;
    render();
  } catch (e) {
    if (e.status === 404 && ticket === current) { current = null; data = null; store('lastTicket'); $('out').hidden = true; }
    $('err').textContent = e.status === 404 ? e.message : 'Could not connect. Retrying…';
  }
}

function render() {
  if (!data) return;
  $('out').hidden = false;
  $('ticket').textContent = data.ticket;
  $('tests').innerHTML = data.tests.map((t, i) => `<div class="card" data-i="${i}">
      <div><div class="name">${esc(t.code)}</div>${t.name !== t.code ? `<div class="full">${esc(t.name)}</div>` : ''}<div class="due-at"></div></div>
      <div class="right"><div class="time"></div><span class="pill"></span></div></div>`).join('');
  tick();
}

function tick() {
  if (!data) return;
  let ready = 0, latest = 0;
  for (const el of $('tests').children) {
    const t = data.tests[+el.dataset.i];
    const st = liveStatus(t);
    if (st === 'ready') ready++;
    latest = Math.max(latest, t.dueAt);
    el.className = 'card ' + st;
    el.querySelector('.time').textContent = st === 'ready' ? 'Ready' : st === 'due' ? 'Any moment' : fmtRemaining(t.dueAt - nowMs());
    el.querySelector('.pill').textContent = STATUS_LABEL[st];
    el.querySelector('.due-at').textContent = st === 'ready' ? 'Ready since ' + fmtClock(t.readyAt) : 'Expected about ' + fmtClock(t.dueAt);
  }
  const n = data.tests.length, s = $('summary');
  s.className = 'summary' + (ready === n ? ' all-ready' : '');
  s.textContent = ready === n ? 'All your results are ready. Please come to the reception counter.'
    : `${ready} of ${n} ready · last result expected about ${fmtClock(latest)}`;
}

$('f').onsubmit = (e) => { e.preventDefault(); load($('id').value); };
$('other').onclick = () => { current = null; data = null; store('lastTicket'); $('out').hidden = true; $('id').value = ''; $('id').focus(); history.replaceState(null, '', '/t'); };

const fromPath = location.pathname.split('/')[2];
load(fromPath || recall('lastTicket') || '');
if (!fromPath) $('id').focus();
onLiveChange(() => current && load(current), 20000);
setInterval(tick, 1000);
</script>
</body>
</html>
